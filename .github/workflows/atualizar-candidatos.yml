name: Atualizar candidaturas do TSE

on:
  schedule:
    - cron: '17 9 * * *'   # todo dia, 06:17 (Brasília)
  workflow_dispatch:
    inputs:
      anos:
        description: 'Anos separados por espaço (vazio = padrão do script)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: atualizar-candidatos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar e processar dados abertos do TSE
        run: python3 scripts/atualizar_candidatos.py ${{ github.event.inputs.anos }}

      - name: Salvar alterações
        run: |
          if [ -n "$(git status --porcelain data/candidatos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/candidatos
            git commit -m "Atualiza candidaturas do TSE ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Sem mudanças nos dados."
          fi
